name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        destination: ['generic/platform=iOS', 'generic/platform=iOS Simulator']
    steps:
      - uses: actions/checkout@v4
      - name: List installed Xcode versions
        run: ls -d /Applications/Xcode*.app
      - name: Select the newest Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version
      - name: Build
        run: |
          xcodebuild build \
            -project VizblDemo.xcodeproj \
            -scheme VizblDemo \
            -destination '${{ matrix.destination }}' \
            CODE_SIGNING_ALLOWED=NO
