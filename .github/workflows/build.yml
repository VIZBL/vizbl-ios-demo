name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: xcode-27
    strategy:
      fail-fast: false
      matrix:
        xcode: ['oldest', 'newest']
        destination: ['generic/platform=iOS', 'generic/platform=iOS Simulator']
    steps:
      - uses: actions/checkout@v4
      - name: List installed Xcode versions
        run: ls -d /Applications/Xcode*.app
      - name: Select Xcode
        run: |
          if [ "${{ matrix.xcode }}" = "oldest" ]; then
            XC=$(ls -d /Applications/Xcode_27*.app | sort -V | head -1)
          else
            XC=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          fi
          sudo xcode-select -s "$XC"
          xcodebuild -version
      - name: Build
        run: |
          xcodebuild build \
            -project VizblDemo.xcodeproj \
            -scheme VizblDemo \
            -destination '${{ matrix.destination }}' \
            CODE_SIGNING_ALLOWED=NO
